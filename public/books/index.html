<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>ChatGPT Discord Bot</title>

    <!-- フォント高速化 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Material+Icons+Outlined" rel="stylesheet">

    <!-- CSS -->
    <link href="/books/css/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="back-to-top">
            <a href="../index.html">← ポートフォリオのトップへ戻る</a>
        </div>
        <div class="site-title"><h1>📚本紹介サイト(機能一覧)</h1></div>
    </header>
    <main>
         <section id="screenshot">
            <div>
                <img id="screenshot-img" src="/img/books.webp">
            </div>
        </section>
        <section id="about">
            <h2>🔍書籍検索・絞り込み機能</h2>
            <dl>
                <dt>絞り込み検索</dt>
                <dd>作者・本の種類・日付による書籍の絞り込みに対応。</dd>
                <dt>リンクによる絞り込み</dt>
                <dd>作者名や本の種類をクリックすることで、該当する書籍に絞り込み可能。</dd>
            </dl>
            <h2>📖 書籍閲覧機能</h2>
            <dl>
                <dt>書籍一覧・ページネーション</dt>
                <dd>書籍を一覧表示し、ページを切り替えて閲覧可能。</dd>
                <dt>書籍詳細ページ</dt>
                <dd>作品名をクリックすると、書籍の詳細情報を表示。</dd>
            </dl>
        </section>

        <section id="link">
            <div>
                <div class="github"><a href="https://github.com/satoshi0926/books" target="_blank" class="github"><img src="/img/github-icon.svg" alt="github">GitHubリンク</a></div>
            </div
            </section>
    </main>
    <script src="/discord/js/main.js"></script>
</body>
</html>
